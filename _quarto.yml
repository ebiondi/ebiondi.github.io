# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Emily Biondi, MSN, APRN-CNM"                                # Your name
  description: "Biomedical Engineer and Certified Nurse Midwife(CNM)"   # A brief slogan (optional)
  image: img/my_image.jpg
  
  favicon: img/favicon.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: true
    logo: /img/logo.png
    
    # your sub-pages
    left:
      - text: "CV"
        href: cv/index.qmd
      - text: "Education"
        href: Education/index.qmd
      - text: "Projects"
        href: projects/index.qmd
      - text: "Blog"
        href: Blog/index.qmd
      - text: "Dashboard"
        href: Dashboard/index.qmd
  
    
    # your social media handles
    right:
      - icon: envelope
        aria-label: email
        href: "mailto:eam206@case.edu"  
      - icon: github
        href: https://github.com/ebiondi
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: |
      <span class="faux-block">&#169; 2026 Emily Biondi </span>
   
project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1em
    theme: 
      - pulse
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true